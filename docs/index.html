<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A merge game about running a branding studio. Merge the work, deliver to clients, survive the feedback. By Ademan Studio.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Make It Pop">
  <meta property="og:title" content="Make It Pop">
  <meta property="og:description" content="Merge the work. Deliver to clients. Survive the feedback. A game by Ademan Studio.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://smith104th.github.io/make-it-pop/">
  <meta property="og:image" content="https://smith104th.github.io/make-it-pop/og.jpg?v=0c25b817">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>Make It Pop · Ademan Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=0c25b817">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=0c25b817">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap">
  <link rel="preload" href="fonts/chivo-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=0c25b817">
</head>
<body>
  <div id="app" hidden>
    <header class="top">
      <div class="brand"><span class="mk" id="brand-mark"></span><b>Make It Pop</b></div>
      <button id="mate" class="pill res" type="button" aria-label="Mate"></button>
      <span id="coins" class="pill res" aria-label="Money"></span>
      <button id="ahre" class="pill res" type="button" aria-label="AHRE: clear all client notes"></button>
    </header>
    <main>
      <section id="screen-desk" class="screen on" aria-label="Desk">
        <div id="orders" class="orders"></div>
        <div id="daphi" class="daphi"><button class="av" type="button" aria-label="Daphi"></button><div class="bubble"><small>DAPHI</small><p></p></div></div>
        <div id="boardwrap"><div id="board" class="board"></div></div>
        <div id="inspector" class="inspector"></div>
      </section>
      <section id="screen-notes" class="screen" aria-label="Client notes"></section>
      <section id="screen-studio" class="screen" aria-label="Studio"></section>
      <section id="screen-wall" class="screen" aria-label="Portfolio"></section>
    </main>
    <nav id="dock">
      <button type="button" data-s="desk">Desk</button>
      <button type="button" data-s="notes">Notes</button>
      <button type="button" data-s="studio">Studio</button>
      <button type="button" data-s="wall">Portfolio</button>
    </nav>
  </div>
  <div id="sheet" hidden></div>
  <script type="module" src="app.js?v=0c25b817"></script>
</body>
</html>
